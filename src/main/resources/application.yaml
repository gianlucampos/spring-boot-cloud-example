server:
  port: 8081

spring:
  application:
    name: kafka-migration

  config:
    import: configserver:http://localhost:8080
  cloud:
    bus:
      enabled: true
      refresh:
        enabled: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

management:
  endpoints:
    web:
      exposure:
        include: health,refresh,busrefresh

kafka:
  aws:
    bootstrap-servers: localhost:9092
    group-id: consumer-aws

  gcp:
    bootstrap-servers: localhost:9094
    group-id: consumer-gcp
